name: pr-build

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    # Each side builds when its own directory changed. A change to .github/
    # builds both, since a workflow edit can break either build; files at the
    # repo root build neither.
    outputs:
      api: ${{ steps.diff.outputs.api == 'true' || steps.diff.outputs.workflows == 'true' }}
      app: ${{ steps.diff.outputs.app == 'true' || steps.diff.outputs.workflows == 'true' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: diff
        uses: ./.github/actions/detect-changes

  # The images are built, not pushed: nothing deploys a PR build. cache-from
  # reads the cache the deploy workflow writes on main; PR builds do not write
  # their own, which would only evict main's from the shared cache quota.
  api:
    name: Build API
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: api
          platforms: linux/amd64
          outputs: type=cacheonly
          cache-from: type=gha,scope=api

  app:
    name: Build App
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: app
          platforms: linux/amd64
          outputs: type=cacheonly
          cache-from: type=gha,scope=app

  # The one check to require. A skipped job counts as passing for a required
  # check, so requiring the builds themselves would let a failed change
  # detection through; this job always runs, and passes only when every build
  # either succeeded or had nothing to build.
  build:
    name: PR Build Images
    needs: [changes, api, app]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          API: ${{ needs.api.result }}
          APP: ${{ needs.app.result }}
        run: |
          echo "changes: $CHANGES, api: $API, app: $APP"
          if [ "$CHANGES" != success ]; then
            echo "::error::Change detection did not succeed ($CHANGES)"
            exit 1
          fi
          for result in "$API" "$APP"; do
            case "$result" in
              success | skipped) ;;
              *)
                echo "::error::A build did not succeed ($result)"
                exit 1
                ;;
            esac
          done
