name: app-linter-check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A skipped job counts as passing a required check, so the linter does not
  # skip as a job: it detects changes itself and skips its remaining steps
  # when app/ did not change.
  lint:
    name: App Linter
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: diff
        uses: ./.github/actions/detect-changes

      - uses: actions/setup-node@v5
        if: steps.diff.outputs.app == 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - if: steps.diff.outputs.app == 'true'
        run: npm ci

      - name: Typecheck
        if: steps.diff.outputs.app == 'true'
        run: npm run typecheck

      - name: ESLint
        if: steps.diff.outputs.app == 'true'
        run: npm run lint

      - name: Prettier
        if: steps.diff.outputs.app == 'true'
        run: npm run format:check
