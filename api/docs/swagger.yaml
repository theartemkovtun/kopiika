basePath: /
definitions:
  schemas.AccountBaseSchema:
    properties:
      colorHex:
        example: '#1E88E5'
        type: string
      currency:
        example: uah
        type: string
      description:
        example: Main salary card
        type: string
      id:
        example: 123e4567-e89b-12d3-a456-426614174000
        type: string
      name:
        example: Monobank card
        type: string
    type: object
  schemas.AccountSchema:
    properties:
      amount:
        $ref: '#/definitions/schemas.AmountSchema'
      colorHex:
        example: '#1E88E5'
        type: string
      description:
        example: Main salary card
        type: string
      id:
        example: 123e4567-e89b-12d3-a456-426614174000
        type: string
      localizedAmount:
        allOf:
        - $ref: '#/definitions/schemas.AmountSchema'
        description: |-
          LocalizedAmount is Amount converted into the user's own currency, so a
          client can total accounts that are denominated differently.
      name:
        example: Monobank card
        type: string
    type: object
  schemas.AccountsBalanceSchema:
    properties:
      accounts:
        items:
          $ref: '#/definitions/schemas.AccountSchema'
        type: array
      total:
        $ref: '#/definitions/schemas.AmountSchema'
    type: object
  schemas.AmountSchema:
    properties:
      currency:
        example: uah
        type: string
      value:
        example: "1250.50"
        type: string
    type: object
  schemas.CategorySchema:
    properties:
      hexColor:
        example: '#43A047'
        type: string
      icon:
        example: shopping-cart
        type: string
      id:
        example: 12
        type: integer
      name:
        example: Groceries
        type: string
    type: object
  schemas.CreateAccountSchema:
    properties:
      colorHex:
        example: '#1E88E5'
        maxLength: 7
        type: string
      currency:
        example: uah
        type: string
      defaultValue:
        example: "1250.50"
        type: string
      description:
        example: Main salary card
        maxLength: 256
        type: string
      name:
        example: Monobank card
        maxLength: 64
        type: string
    required:
    - colorHex
    - currency
    - name
    type: object
  schemas.CreateCategorySchema:
    properties:
      hexColor:
        description: |-
          HexColor is spelled this way, rather than the accounts colorHex, because
          that is the key the existing clients send and read.
        example: '#43A047'
        maxLength: 64
        type: string
      icon:
        example: shopping-cart
        maxLength: 64
        type: string
      name:
        example: Groceries
        maxLength: 64
        type: string
    required:
    - hexColor
    - icon
    - name
    type: object
  schemas.CreateTransactionSchema:
    properties:
      accountId:
        example: 123e4567-e89b-12d3-a456-426614174000
        type: string
      categoryId:
        example: 1
        type: integer
      currency:
        example: uah
        type: string
      day:
        example: 12
        maximum: 31
        minimum: 1
        type: integer
      description:
        example: Weekly shop
        maxLength: 256
        type: string
      month:
        example: 9
        maximum: 12
        minimum: 1
        type: integer
      title:
        example: Groceries
        maxLength: 64
        type: string
      type:
        enum:
        - income
        - outcome
        example: outcome
        type: string
      value:
        description: |-
          Value is a pointer so that a missing value is rejected while an explicit
          zero is still accepted, as in Python.
        example: "125.40"
        type: string
      year:
        example: 2026
        maximum: 2200
        minimum: 1900
        type: integer
    required:
    - currency
    - day
    - month
    - title
    - type
    - value
    - year
    type: object
  schemas.HealthSchema:
    properties:
      status:
        example: ok
        type: string
    type: object
  schemas.PaginatedResponse-schemas_AccountSchema:
    properties:
      items:
        items:
          $ref: '#/definitions/schemas.AccountSchema'
        type: array
      page:
        type: integer
      take:
        type: integer
      total:
        type: integer
    type: object
  schemas.ReadinessSchema:
    properties:
      database:
        example: ok
        type: string
      error:
        type: string
      status:
        example: ok
        type: string
    type: object
  schemas.TransactionSchema:
    properties:
      account:
        $ref: '#/definitions/schemas.AccountBaseSchema'
      amount:
        $ref: '#/definitions/schemas.AmountSchema'
      category:
        $ref: '#/definitions/schemas.CategorySchema'
      date:
        example: "2026-09-12"
        type: string
      description:
        example: Weekly shop
        type: string
      id:
        example: 123e4567-e89b-12d3-a456-426614174000
        type: string
      localizedAmount:
        allOf:
        - $ref: '#/definitions/schemas.AmountSchema'
        description: |-
          LocalizedAmount is Amount converted into the user's own currency at the
          rate for the transaction's own date, not today's.
      tags:
        description: |-
          Tags is always empty: tags are not ported yet, and the key is kept so the
          response shape stays the one the clients already read.
        items:
          type: string
        type: array
      title:
        description: Title and Description are what the user typed, not a derived
          label.
        example: Groceries
        type: string
      type:
        example: outcome
        type: string
    type: object
  schemas.UpdateTransactionSchema:
    properties:
      accountId:
        example: 123e4567-e89b-12d3-a456-426614174000
        type: string
      categoryId:
        example: 1
        type: integer
      currency:
        example: uah
        type: string
      description:
        example: Weekly shop
        maxLength: 256
        type: string
      id:
        example: 123e4567-e89b-12d3-a456-426614174000
        type: string
      title:
        example: Groceries
        maxLength: 64
        type: string
      type:
        enum:
        - income
        - outcome
        example: outcome
        type: string
      value:
        example: "125.40"
        type: string
    required:
    - currency
    - id
    - title
    - type
    - value
    type: object
  schemas.UpdateUserSchema:
    properties:
      currency:
        example: uah
        type: string
      language:
        example: uk
        type: string
    type: object
  schemas.UserSchema:
    properties:
      currency:
        example: uah
        type: string
      id:
        example: 123e4567-e89b-12d3-a456-426614174000
        type: string
      language:
        example: uk
        type: string
      name:
        example: John Doe
        type: string
      pictureUrl:
        example: https://example.com/picture.png
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: Personal finance API for accounts, transactions and budgets
  title: Kopiika API
  version: "1.0"
paths:
  /health:
    get:
      description: Reports that the process is serving requests. Checks no dependencies.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/schemas.HealthSchema'
      summary: Health check
      tags:
      - health
  /health/live:
    get:
      description: Reports that the process is alive. Always 200 while the server
        is up, so a failure means the process should be restarted.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/schemas.HealthSchema'
      summary: Liveness probe
      tags:
      - health
  /health/ready:
    get:
      description: Reports whether the service can serve traffic, verifying the database
        connection. Returns 503 when a dependency is unavailable.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/schemas.ReadinessSchema'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/schemas.ReadinessSchema'
      summary: Readiness probe
      tags:
      - health
  /v1/accounts:
    get:
      consumes:
      - application/json
      description: List the authenticated user's accounts. Pages are cut by creation
        order; within a page accounts are ordered by their localized amount, richest
        first
      parameters:
      - default: 1
        description: Page number, 1-indexed
        in: query
        name: page
        type: integer
      - default: 10
        description: Items per page
        in: query
        name: take
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/schemas.PaginatedResponse-schemas_AccountSchema'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List accounts
      tags:
      - accounts
    post:
      consumes:
      - application/json
      description: Create a new account for the authenticated user
      parameters:
      - description: Account to create
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/schemas.CreateAccountSchema'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/schemas.AccountSchema'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create account
      tags:
      - accounts
  /v1/accounts/{accountId}:
    delete:
      consumes:
      - application/json
      description: Soft delete one of the authenticated user's accounts. Idempotent.
      parameters:
      - description: Account id
        in: path
        name: accountId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete account
      tags:
      - accounts
    get:
      consumes:
      - application/json
      description: Get one of the authenticated user's accounts by id
      parameters:
      - description: Account id
        in: path
        name: accountId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/schemas.AccountSchema'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get account
      tags:
      - accounts
  /v1/accounts/balance:
    get:
      consumes:
      - application/json
      description: Every account the authenticated user holds plus their combined
        worth in the user's own currency, richest first
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/schemas.AccountsBalanceSchema'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get accounts balance
      tags:
      - accounts
  /v1/categories:
    get:
      consumes:
      - application/json
      description: List the authenticated user's own categories together with the
        global defaults, ordered by id. Unpaginated
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/schemas.CategorySchema'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List categories
      tags:
      - categories
    post:
      consumes:
      - application/json
      description: Create a new category owned by the authenticated user
      parameters:
      - description: Category to create
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/schemas.CreateCategorySchema'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/schemas.CategorySchema'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create category
      tags:
      - categories
  /v1/categories/{categoryId}:
    delete:
      consumes:
      - application/json
      description: Soft delete one of the authenticated user's own categories. Idempotent,
        and global default categories are never deletable
      parameters:
      - description: Category id
        in: path
        name: categoryId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete category
      tags:
      - categories
  /v1/transactions:
    post:
      consumes:
      - application/json
      description: 'Create a transaction for the authenticated user. When it names
        an account, the account''s balance moves with it: income adds the value, outcome
        subtracts it, and the transaction currency must match the account''s'
      parameters:
      - description: Transaction to create
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/schemas.CreateTransactionSchema'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/schemas.TransactionSchema'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create transaction
      tags:
      - transactions
    put:
      consumes:
      - application/json
      description: Update one of the authenticated user's transactions, identified
        by the id in the body. Every field is replaced, so an omitted description,
        category or account clears it. The date cannot be changed. Balances are rebalanced,
        including when the transaction moves between accounts
      parameters:
      - description: Transaction to update
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/schemas.UpdateTransactionSchema'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/schemas.TransactionSchema'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update transaction
      tags:
      - transactions
  /v1/transactions/{transactionId}:
    delete:
      consumes:
      - application/json
      description: 'Soft delete one of the authenticated user''s transactions, taking
        its effect back off the account balance. Idempotent: a repeat delete does
        not move the balance again'
      parameters:
      - description: Transaction id
        in: path
        name: transactionId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete transaction
      tags:
      - transactions
  /v1/users:
    post:
      consumes:
      - application/json
      description: Create the local configuration for the authenticated Cognito user.
        Idempotent.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/schemas.UserSchema'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Setup user
      tags:
      - users
  /v1/users/me:
    get:
      consumes:
      - application/json
      description: Get the currently authenticated user's configuration
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/schemas.UserSchema'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get current user
      tags:
      - users
    put:
      consumes:
      - application/json
      description: Update the authenticated user's language and default currency
      parameters:
      - description: User configuration
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/schemas.UpdateUserSchema'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/schemas.UserSchema'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update current user
      tags:
      - users
schemes:
- http
- https
securityDefinitions:
  BearerAuth:
    description: 'Enter your Bearer token in the format: Bearer {token}'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
