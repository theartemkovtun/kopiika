  /v1/transactions/statistics:
    get:
      consumes:
      - application/json
      description: Report on everything the authenticated user recorded between two
        days, inclusive, in their own currency. Every transaction is converted at
        the rate for its own date rather than today's. Without full, only the income,
        outcome and difference totals, the per-day series and the category spending
        breakdown are populated; the remaining fields hold their zero values so the
        response shape does not change
      parameters:
      - description: First day of the range (YYYY-MM-DD)
        in: query
        name: fromDate
        required: true
        type: string
      - description: Last day of the range (YYYY-MM-DD)
        in: query
        name: toDate
        required: true
        type: string
      - default: false
        description: Also report the counts, averages, extremes and account breakdowns
        in: query
        name: full
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
