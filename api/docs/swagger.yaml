  /v1/transactions/date/{date}:
    get:
      consumes:
      - application/json
      description: Get everything the authenticated user spent or earned on one day.
        Answers null for a day with no transactions
      parameters:
      - description: Day to fetch (YYYY-MM-DD)
        in: path
        name: date
        required: true
