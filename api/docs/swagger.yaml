basePath: /v1
definitions:
  schemas.UpdateUserSchema:
    properties:
      currency:
        example: UAH
        type: string
      language:
        example: uk
        type: string
    type: object
  schemas.UserSchema:
    properties:
      currency:
        example: UAH
        type: string
      id:
        example: 123e4567-e89b-12d3-a456-426614174000
        type: string
      language:
        example: uk
        type: string
      name:
        example: John Doe
        type: string
      pictureUrl:
        example: https://example.com/picture.png
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: Personal finance API for accounts, transactions and budgets
  title: Kopiika API
  version: "1.0"
paths:
  /users:
    post:
      consumes:
      - application/json
      description: Create the local configuration for the authenticated Cognito user.
        Idempotent.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/schemas.UserSchema'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Setup user
      tags:
      - users
  /users/me:
    get:
      consumes:
      - application/json
      description: Get the currently authenticated user's configuration
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/schemas.UserSchema'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get current user
      tags:
      - users
    put:
      consumes:
      - application/json
      description: Update the authenticated user's language and default currency
      parameters:
      - description: User configuration
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/schemas.UpdateUserSchema'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/schemas.UserSchema'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update current user
      tags:
      - users
schemes:
- http
- https
securityDefinitions:
  BearerAuth:
    description: 'Enter your Bearer token in the format: Bearer {token}'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
