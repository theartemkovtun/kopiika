services:
  kopiika-api:
    build: .
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DATABASE_URL=postgres://postgres:password@db:5432/kopiika?sslmode=disable
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://localhost:5173
      - COGNITO_REGION=${COGNITO_REGION}
      - COGNITO_USER_POOL_ID=${COGNITO_USER_POOL_ID}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health/live"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - kopiika-network

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=kopiika
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kopiika"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - kopiika-network

volumes:
  postgres-data:

networks:
  kopiika-network:
    driver: bridge
